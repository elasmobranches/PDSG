# A cut-down recipe for checking the pipeline runs. Do not use it to
# reproduce the published numbers.

data:
  root: ./data/greenhouse
  splits: {train: train, val: valid, test: test}
  size: [512, 512]
  keep_ratio: false

augmentation:
  hflip:       {p: 0.5}
  photometric: {brightness: 0.45, contrast: 0.20, p: 0.6}

loss:
  cross_entropy: {weight: 1.0, class_weight: [0.5, 3.0, 3.0, 1.0, 3.0, 0.5, 1.0, 1.0]}
  dice:          {weight: 1.0, eps: 1.0e-3}
  auxiliary:     {weight: 0.4}

optim:
  type: AdamW
  lr: 2.0e-4
  weight_decay: 0.01
  clip_grad: {max_norm: 5.0, norm_type: 2}
  paramwise:  {head: {lr_mult: 5.0}, norm: {decay_mult: 0.0}}
  per_backbone:
    segnext_t:     {betas: [0.9, 0.999], paramwise: {head: {lr_mult: 10.0}}}
    convnext_atto: {weight_decay: 0.05,  paramwise: {bias: {decay_mult: 0.0}}}

schedule: {max_iters: 200, warmup: {iters: 20, start_factor: 0.01}, poly: {power: 0.9, eta_min_ratio: 0.01}}
runtime:  {batch_size: 16, num_workers: 4, num_workers_eval: 4, val_interval: 50,
           early_stopping: {monitor: mIoU, patience: 20, min_delta: 0.01},
           save_best: mIoU, seeds: [31]}

hd:
  depth_pretrained: true
