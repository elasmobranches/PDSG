[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chamnet"
version = "1.0.0"
description = "RGB-D fusion for greenhouse semantic segmentation"
requires-python = ">=3.10"
dependencies = [
    "mmengine>=0.10,<0.11",
    "mmcv>=2.1,<2.2",
    "mmsegmentation>=1.2,<1.3",
    "timm>=1.0",
    "albumentations>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest", "Pillow>=10.0"]

[project.scripts]
chamnet = "chamnet.cli:main"

[tool.setuptools.packages.find]
include = ["chamnet*"]

[tool.setuptools.package-data]
chamnet = ["recipes/*.yaml"]

[tool.pytest.ini_options]
markers = [
    # Tests that download the ImageNet checkpoints the paper's runs used.
    # They stay in the default run on purpose: the only way to observe that
    # pretrained weights actually landed in a depth encoder is to have the
    # pretrained weights, and a check that skips itself when the download
    # fails is a check that can silently stop checking -- this project has
    # already shipped an arm whose depth encoder was random while its log
    # said otherwise. If you genuinely need an offline run, deselect them
    # explicitly with `pytest -m "not network"`, which leaves a visible
    # record of what was not verified. Do not convert them to skips.
    "network: downloads pretrained checkpoints (deselect with -m 'not network')",
]
