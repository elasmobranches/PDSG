[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chamnet"
version = "1.0.0"
description = "RGB-D fusion for greenhouse semantic segmentation"
requires-python = ">=3.10"
dependencies = [
    "mmengine>=0.10,<0.11",
    "mmcv>=2.1,<2.2",
    "mmsegmentation>=1.2,<1.3",
    "timm>=1.0",
    "albumentations>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest", "Pillow>=10.0"]

[project.scripts]
chamnet = "chamnet.cli:main"

[tool.setuptools.packages.find]
include = ["chamnet*"]

[tool.setuptools.package-data]
chamnet = ["recipes/*.yaml"]
